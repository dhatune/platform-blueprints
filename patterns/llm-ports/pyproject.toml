[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-ports"
version = "0.1.0"
description = "Provider-agnostic language model access through ports and adapters"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_ports = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -m 'not contract'"
markers = [
    "contract: runs against a real provider; needs LLM_CONTRACT_* in the environment",
]
