# What this can and cannot catch.
#
# Everything here runs without credentials and without a cluster, which bounds
# it precisely: it checks that the code is well formed, internally consistent,
# and free of anything that should not be published. It does not check that the
# infrastructure works.
#
# That distinction is not academic. Applying this repository's landing zone to
# a real organization found four defects that every check below passes: a
# resource key built from values that do not exist until apply, two modules
# that refused to be destroyed, an API used without being declared, and a
# permission that has to be granted above the stack. None of them are visible
# without a real API answering back.
#
# So this pipeline is a floor, not a proof. It is here to stop the boring
# failures: a stray secret, a broken link, an unformatted file, a real
# hostname copied in from somewhere it should not be, so that review time goes
# to the things it cannot see.

name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Third-party actions are pinned to a commit, not to a tag.
#
# This repository argues in two other places that a tag can be moved to point
# somewhere else and a digest cannot, and then asks you to trust ten actions
# pinned to v4 and v3. A tag on an action is a moving pointer controlled by
# somebody else, and these run with the checkout and the workflow token. The
# comment after each pin records which release it was, since a bare commit is
# unreadable.

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # gitleaks needs history to scan commits, not only the working tree.
          # A secret removed in a later commit is still a leaked secret.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  no-real-identifiers:
    name: no real identifiers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Refuse anything traceable to a live environment
        run: |
          # The repository's ground rule says no project identifiers, no
          # domains, no client names. A rule nobody checks is a preference,
          # so it is checked here.
          #
          # The list is deliberately specific rather than clever. A general
          # pattern for "looks like a real hostname" would flag every example,
          # and a check that cries wolf gets deleted.
          # The author's surname is not on the list. The repository is his and
          # carries his name; what must not appear is an environment: project
          # prefixes, company domains, live hostnames.
          #
          # This file is excluded because it contains the patterns themselves,
          # and a check that fails on its own definition teaches people to
          # ignore it.
          patterns='htn-|hatun\.io|confiadigital|caferelieve|flows\.|spar\.'
          if grep -rniE "$patterns" \
               --exclude-dir=.git --exclude-dir=.terraform \
               --exclude='*.lock.hcl' \
               --exclude='checks.yml' . ; then
            echo "::error::Found something traceable to a live environment."
            exit 1
          fi
          echo "Nothing traceable found."

  python:
    name: python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: patterns/llm-ports
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" pytest mypy
      - name: Tests
        run: pytest -q
      - name: Types
        # --strict, because the default mode does not inspect the bodies of
        # unannotated functions and would pass a file it never really read.
        run: mypy --strict src/

  terraform:
    name: terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_wrapper: false
      - name: Format
        run: terraform fmt -check -recursive .
      - name: Validate every module and composition
        run: |
          set -e
          for dir in landing-zone/modules/*/ landing-zone/example platform/vaultwarden/cloud-run; do
            echo "--- $dir"
            # Where a lock file is committed, refuse to update it. A run that
            # silently rewrites the lock verifies whatever it just downloaded
            # rather than what was reviewed.
            if [ -f "$dir/.terraform.lock.hcl" ]; then
              terraform -chdir="$dir" init -backend=false -input=false -lockfile=readonly >/dev/null
            else
              terraform -chdir="$dir" init -backend=false -input=false >/dev/null
            fi
            terraform -chdir="$dir" validate
          done

  kubernetes:
    name: kubernetes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate manifests against the API schemas
        run: |
          # kubeconform checks the manifests against real Kubernetes schemas,
          # which catches a misspelled field that a YAML parser accepts happily.
          curl -sSL -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xzf kubeconform.tar.gz kubeconform
          ./kubeconform -summary -strict -ignore-missing-schemas \
            platform/n8n/base platform/vaultwarden/deploy
      - name: Compose the overlays
        run: |
          for overlay in platform/n8n/base platform/n8n/test platform/vaultwarden/deploy; do
            kubectl kustomize "$overlay" >/dev/null && echo "ok  $overlay"
          done

  shell:
    name: shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck platform/vaultwarden/backup/*.sh

  links:
    name: links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Every relative link resolves
        run: |
          fail=0
          while IFS= read -r file; do
            while IFS= read -r target; do
              case "$target" in http*|\#*) continue ;; esac
              target_path="$(dirname "$file")/${target%%#*}"
              if [ ! -e "$target_path" ]; then
                echo "broken: $file -> $target"
                fail=1
              fi
            done < <(grep -oE '\]\([^)]+\)' "$file" | sed 's/](//;s/)$//')
          done < <(find . -name '*.md' -not -path './.git/*')
          exit $fail

  lock-files:
    name: lock files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Only where Terraform runs, and covering every platform
        run: |
          fail=0

          # A lock file belongs to a root module: the directory init and apply
          # are run in. Terraform never reads one from a child module, so a lock
          # file under modules/ is a leftover from validating there, and keeping
          # it implies a guarantee nothing enforces.
          #
          # The rule is the path rather than "does this directory declare a
          # provider", because a root module is not required to declare one and
          # that test gives the wrong answer for configurations that rely on the
          # implicit default.
          while IFS= read -r lock; do
            case "$lock" in
              */modules/*)
                echo "::error file=$lock::Lock file in a child module; Terraform never reads it."
                fail=1
                ;;
            esac
          done < <(git ls-files '*.terraform.lock.hcl')

          # Each committed lock must cover the three platforms this is built
          # and run on. One h1 hash means it was generated on somebody's laptop
          # and will fail on a Linux runner with a checksum error that reads
          # like a corrupted download.
          while IFS= read -r lock; do
            n=$(grep -c '"h1:' "$lock" || true)
            if [ "$n" -lt 3 ]; then
              echo "::error file=$lock::Only $n platform hash(es). Run: terraform providers lock -platform=linux_amd64 -platform=darwin_arm64 -platform=darwin_amd64"
              fail=1
            else
              echo "ok  $lock  ($n platforms)"
            fi
          done < <(git ls-files '*.terraform.lock.hcl')

          exit $fail

  dependencies:
    name: dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # A repository that argues about supply chains and does not examine its
      # own is making an argument it does not follow. This is the cheapest
      # possible version: it reads what is declared and reports what is known
      # to be wrong with it.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Known vulnerabilities in Python dependencies
        run: |
          pip install --quiet pip-audit
          # Audit the declared dependencies, not the package itself. Auditing a
          # local project asks the index about something that was never
          # published, and the run fails on the absence rather than on a
          # finding.
          pip-audit --strict --desc --skip-editable patterns/llm-ports

      # Terraform's own scanning of the configuration, for the class of mistake
      # that is syntactically fine and operationally wrong: a bucket without
      # encryption, a rule open to the world, a resource missing a control.
      - name: Configuration security scan
        run: |
          curl -sSL -o tfsec.tar.gz \
            https://github.com/aquasecurity/tfsec/releases/download/v1.28.14/tfsec_1.28.14_linux_amd64.tar.gz
          tar xzf tfsec.tar.gz tfsec
          # Soft-fail: this reports opinions, several of which this repository
          # disagrees with deliberately and documents why. A failing build on a
          # disputed opinion teaches people to bypass the build.
          # One path per invocation. Passing two is rejected with a usage
          # message rather than a hint about the argument count.
          for dir in landing-zone platform; do
            echo "--- $dir"
            ./tfsec "$dir" --soft-fail --format lovely
          done
