apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  replicas: 1
  # Recreate, not RollingUpdate. The database is a single SQLite file on a
  # ReadWriteOnce volume. A rolling update would start the new pod before
  # stopping the old one, and for those seconds two processes would hold the
  # same database file open. Recreate accepts a few seconds of downtime to
  # make that impossible. This service must never run more than one replica.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vaultwarden
  template:
    metadata:
      labels:
        app: vaultwarden
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vaultwarden
          # Pin this by digest before deploying. A tag can be moved to point
          # at a different image; a digest cannot, and for the service holding
          # every other credential, "the image I reviewed" and "the image I
          # run" have to be the same artifact. Resolve the digest for the tag
          # you have actually reviewed and append it:
          #
          #   crane digest vaultwarden/server:1.32.7
          #   image: vaultwarden/server:1.32.7@sha256:<digest>
          #
          # No digest is written here because a digest copied from a document
          # rather than resolved from the registry pins nothing.
          image: vaultwarden/server:1.32.7
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          env:
            # ADMIN_TOKEN is deliberately absent. Vaultwarden enables its admin
            # panel only when this variable is set, so leaving it unset disables
            # the panel outright. See ADR 6 for why a token was not considered
            # sufficient protection.
            - name: ROCKET_PORT
              value: "8080"
            - name: SIGNUPS_ALLOWED
              value: "false"
            - name: INVITATIONS_ALLOWED
              value: "true"
            - name: SHOW_PASSWORD_HINT
              value: "false"
            - name: DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: vaultwarden-config
                  key: domain
            - name: SMTP_HOST
              valueFrom:
                configMapKeyRef:
                  name: vaultwarden-config
                  key: smtp_host
            - name: SMTP_FROM
              valueFrom:
                configMapKeyRef:
                  name: vaultwarden-config
                  key: smtp_from
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-smtp
                  key: username
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-smtp
                  key: password
          volumeMounts:
            - name: data
              mountPath: /data
            # The root filesystem is read-only, so every path the process
            # writes to needs an explicit writable mount. Missing one of these
            # shows up as a crash on first request, not on start.
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /alive
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vaultwarden-data
        - name: tmp
          emptyDir: {}
