apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vaultwarden-data
  namespace: vaultwarden
spec:
  accessModes:
    # ReadWriteOnce is correct here and is not a limitation to work around.
    # It is the mechanism that stops a second replica from ever attaching to
    # the same SQLite database.
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # The storage class must provide encryption at rest. The vault's contents are
  # already encrypted by the client, but the file also holds metadata, and a
  # detached disk or a snapshot is a copy of everything.
  storageClassName: encrypted-standard
