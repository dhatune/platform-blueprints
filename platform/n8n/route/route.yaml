# What makes n8n reachable. Applied with the workload, not with the edge.
#
# Only the editor is exposed. The webhook service answers unauthenticated
# requests by design and belongs behind a different door, which is why it is
# not routed here.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: n8n
  namespace: n8n
spec:
  parentRefs:
    - name: edge
      namespace: gateway
      sectionName: https
  hostnames:
    - REPLACE_ME_HOST
  rules:
    - backendRefs:
        - name: n8n
          # The service's port, not the container's. A route naming a port the
          # service does not publish is accepted and answers 500, because what
          # is wrong is the reference rather than the request.
          port: 80
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: n8n
  namespace: n8n
spec:
  default:
    config:
      type: HTTP
      httpHealthCheck:
        # The container's port, not the service's. This probe reaches the pod
        # directly rather than through the service, so the two numbers are
        # different and both are right in their own place.
        port: 5678
        requestPath: /healthz
  targetRef:
    group: ""
    kind: Service
    name: n8n
---
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: n8n
  namespace: n8n
spec:
  default:
    securityPolicy: REPLACE_ME_SECURITY_POLICY
  targetRef:
    group: ""
    kind: Service
    name: n8n
