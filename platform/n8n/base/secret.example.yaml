# Example only. This file documents the two keys the deployment expects; it is
# not applied and holds no values. The real secret is expected to come from a
# secret manager.
#
# db-password     the database role's password
# encryption-key  32 bytes of hex. Encrypts every credential in every workflow.
#                 Generate once, store it where the database backup is not,
#                 and never regenerate it on a live system.
apiVersion: v1
kind: Secret
metadata:
  name: n8n
  namespace: n8n
type: Opaque
stringData:
  db-password: REPLACE_ME
  encryption-key: REPLACE_ME
