# erpnext in dev.
#
# values.env is generated by lab/bootstrap.sh from the stack's outputs and is
# not in version control. Nothing here is filled in by hand.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../route

configMapGenerator:
  - name: edge-values
    namespace: erp
    envs:
      - values.env

generatorOptions:
  disableNameSuffixHash: true

# A replacement whose selector matches nothing is not an error and the
# placeholder survives into the output. The check that refuses a rendered
# manifest still containing one is in the workflow.
replacements:
  - source:
      kind: ConfigMap
      name: edge-values
      fieldPath: data.host
    targets:
      - select:
          kind: HTTPRoute
        fieldPaths:
          - spec.hostnames.0
      - select:
          kind: HealthCheckPolicy
        fieldPaths:
          - spec.default.config.httpHealthCheck.host
  - source:
      kind: ConfigMap
      name: edge-values
      fieldPath: data.securityPolicy
    targets:
      - select:
          kind: GCPBackendPolicy
        fieldPaths:
          - spec.default.securityPolicy
