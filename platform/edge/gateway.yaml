# The entry point.
#
# A Gateway is a load balancer that the platform builds when this object
# appears. It takes minutes rather than seconds, and while it is being built
# the object exists and answers nothing, which reads like a broken
# configuration and is not.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: erp
  namespace: erp
spec:
  # The global external class needs no proxy-only subnet. The regional one
  # does, and a regional Gateway on a network without it stays pending with a
  # message that names the subnet rather than explaining what is missing.
  gatewayClassName: gke-l7-global-external-managed
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: REPLACE_ME_HOST
      tls:
        mode: Terminate
        certificateRefs:
          - name: erp-tls
    # Port 80 exists only to send people to 443. Leaving it off means a plain
    # http:// link fails to connect rather than redirecting, which users report
    # as the site being down.
    - name: http
      protocol: HTTP
      port: 80
      hostname: REPLACE_ME_HOST
---
# The certificate. cert-manager fills the secret the listener above references;
# until it does, the listener is not ready and the Gateway serves nothing on
# 443. That ordering is normal and is the usual reason a first deployment looks
# stuck.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: erp-tls
  namespace: erp
spec:
  secretName: erp-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - REPLACE_ME_HOST
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: erp
  namespace: erp
spec:
  parentRefs:
    - name: erp
      sectionName: https
  hostnames:
    - REPLACE_ME_HOST
  rules:
    - backendRefs:
        - name: erp-erpnext
          port: 8080
---
# Anything arriving on 80 is redirected rather than served. A separate route,
# because a rule that both redirects and proxies is not expressible.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: erp-redirect
  namespace: erp
spec:
  parentRefs:
    - name: erp
      sectionName: http
  hostnames:
    - REPLACE_ME_HOST
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
