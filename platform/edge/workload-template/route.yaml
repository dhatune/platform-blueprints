# What a workload adds to be reachable. Copy this beside the workload, change
# the four names, and apply it with the workload rather than with the edge.
#
# It attaches to the Gateway in another namespace. That is allowed because the
# Gateway's listener accepts routes from anywhere, which is a deliberate choice
# recorded there: the alternative is every route living in the gateway
# namespace, making it a shared writable surface for everyone with a service.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: REPLACE_ME_WORKLOAD
  namespace: REPLACE_ME_NAMESPACE
spec:
  parentRefs:
    - name: edge
      namespace: gateway
      sectionName: https
  hostnames:
    - REPLACE_ME_HOST
  rules:
    - backendRefs:
        - name: REPLACE_ME_SERVICE
          port: 8080
