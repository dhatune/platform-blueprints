# The dev edge.
#
# Every value that differs between environments is in values.env, which is not
# in version control, in the same arrangement the Terraform stack uses. Copy
# values.env.example and fill it from the stack's outputs:
#
#   terraform -chdir=../../../../lab output -json environments
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

configMapGenerator:
  - name: edge-values
    namespace: external-dns
    envs:
      - values.env

# A stable name, because the controller reads these at runtime by name and a
# hashed suffix would leave it pointing at a map that no longer exists.
generatorOptions:
  disableNameSuffixHash: true

# Substitution into the fields that are not environment variables.
#
# A replacement whose target selector matches nothing is not an error and
# produces no warning: the placeholder simply survives into the output. The
# check that refuses a rendered manifest still containing one is what makes
# this safe, and it lives in .github/workflows/checks.yml.
replacements:
  - source:
      kind: ConfigMap
      name: edge-values
      fieldPath: data.wildcard
    targets:
      - select: { kind: Gateway, name: edge }
        fieldPaths:
          - spec.listeners.0.hostname
          - spec.listeners.1.hostname
      - select: { kind: Certificate, name: edge-tls }
        fieldPaths:
          - spec.dnsNames.0
  - source:
      kind: ConfigMap
      name: edge-values
      fieldPath: data.dnsServiceAccount
    targets:
      - select: { kind: ServiceAccount, name: external-dns }
        fieldPaths:
          - metadata.annotations.[iam.gke.io/gcp-service-account]
  - source:
      kind: ConfigMap
      name: edge-values
      fieldPath: data.acmeEmail
    targets:
      - select: { kind: ClusterIssuer, name: letsencrypt }
        fieldPaths:
          - spec.acme.email
  - source:
      kind: ConfigMap
      name: edge-values
      fieldPath: data.dnsProject
    targets:
      - select: { kind: ClusterIssuer, name: letsencrypt }
        fieldPaths:
          - spec.acme.solvers.0.dns01.cloudDNS.project
